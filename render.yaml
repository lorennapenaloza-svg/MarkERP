# Blueprint de Render: crea la app web (Docker) y la base de datos PostgreSQL.
services:
  - type: web
    name: markerp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: markerp-db
          property: connectionString

databases:
  - name: markerp-db
    plan: free
    databaseName: markerp
    user: markerp
